name: hosted-check
# Checks the hosted instance (Google Cloud Run, Zürich) every 6 hours and fails visibly if the public
# endpoint stops answering. A request may start an instance first (scale to zero), hence the retries.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  BASE: https://swiss-grounding-mcp-542630986415.europe-west6.run.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health (retries while an instance starts)
        run: |
          for i in $(seq 1 30); do curl -sf "$BASE/health" && exit 0; sleep 10; done
          exit 1
      - name: MCP answers
        run: |
          curl -sf -X POST "$BASE/mcp" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q search_official_info
