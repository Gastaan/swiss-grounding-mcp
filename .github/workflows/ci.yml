name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests
      - run: uv run pytest -q
      - name: MCP smoke test over HTTP
        run: |
          .venv/bin/swiss-grounding-mcp --transport http --port 8765 &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf localhost:8765/health && break; sleep 1; done
          .venv/bin/fastmcp list http://127.0.0.1:8765/mcp
          kill $SERVER
      - name: Live source checks (informational)
        continue-on-error: true
        run: uv run pytest -q -m live
      - uses: actions/cache@v4
        with:
          path: ~/.cache/swiss-grounding-mcp/models
          key: embedding-model-paraphrase-multilingual-MiniLM-L12-v2
      - name: Hybrid search (semantic extra) and search quality report
        run: |
          uv sync --locked --extra semantic
          uv run --extra semantic pytest -q tests/test_semantic.py
          uv run --extra semantic python scripts/search_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t swiss-grounding-mcp .
      - name: Run it and wait until healthy
        run: |
          docker run -d --name sgm -p 8000:8000 swiss-grounding-mcp
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
      - name: Runs as an unprivileged user
        run: test "$(docker exec sgm id -u)" != "0"
      - name: Serves hybrid search with the model baked in
        # the model loads in the background after start ("loading"), so give it up to 30 s
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health | grep -q '"search":"hybrid' && exit 0; sleep 1; done
          curl -s localhost:8000/health; exit 1
      - name: Answers MCP requests
        run: |
          curl -sf -X POST localhost:8000/mcp -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q search_official_info
      - name: Refuses a foreign browser origin
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp -H 'Origin: http://evil.example' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$code" = "403"
      - if: failure()
        run: docker logs sgm
