<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="562" viewBox="0 0 1200 562" role="img" aria-labelledby="t d">
<title id="t">Swiss Grounding MCP architecture</title>
<desc id="d">An AI assistant asks in Italian for the cheapest health insurance premium in Lugano. It makes one tool call to Swiss Grounding MCP, which picks one of 13 read-only tools, resolves Lugano to CH-TI-5192, fetches the official data politely from federal, cantonal and municipal sources, and returns a cited answer: CHF 449.90 a month, source FOPH, priminfo.admin.ch.</desc>
